name: Deploy to Aruba FTP

on:
  push:
    branches:
      - work-in-progress
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Fix Vite permissions
      run: chmod +x node_modules/.bin/vite || true

    - name: Build project
      run: npm run build

    - name: Deploy via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ssh.og7psbi.webhostingaruba.it
        port: 2222
        username: ro6xrb6-andromeda
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "dist/*"
        target: "./"
        strip_components: 1
